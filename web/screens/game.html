<section id="screen-game" class="screen hidden">
  <div class="game-layout">
    <aside class="panel controls">
      <h3>Setup</h3>
      <label>Graph
        <select id="cfg-preset" class="seat-select"></select>
      </label>
      <label>Nodes <span class="muted small">(odd: 2N + 1, from 3 to 13)</span>
        <input id="cfg-nodes" type="number" min="3" max="13" step="2" value="5" />
      </label>
      <label>Edges <span class="muted small">(a-b pairs, comma-separated)</span>
        <textarea id="cfg-edges" rows="3" spellcheck="false"></textarea>
      </label>
      <div class="btn-row">
        <button id="btn-random-graph" class="btn" title="Draw a new random graph">🎲 Random graph</button>
      </div>

      <div class="seats">
        <div class="seat">
          <h4>Seat 1 <span class="chip chip-a">first</span></h4>
          <select id="seat-0" class="seat-select"></select>
        </div>
        <div class="seat">
          <h4>Seat 2 <span class="chip chip-b">second</span></h4>
          <select id="seat-1" class="seat-select"></select>
        </div>
      </div>

      <label class="inline">AI delay (ms)
        <input id="cfg-delay" type="number" min="0" max="5000" step="100" value="600" />
      </label>

      <div class="toggles">
        <label class="switch"><input type="checkbox" id="toggle-xray" /> X-ray (what each hole would score)</label>
        <label class="switch"><input type="checkbox" id="toggle-why" checked /> Move log</label>
      </div>

      <div class="btn-row">
        <button id="btn-new" class="btn primary">New game</button>
        <button id="btn-share" class="btn" title="Copy a replay link">🔗 Share</button>
      </div>
      <div class="btn-row">
        <button id="btn-play-ai" class="btn" title="Play the AI's turn now">⏭ Step</button>
      </div>
    </aside>

    <div class="panel board-wrap">
      <div id="status" class="status">Choose a graph and press “New game”.</div>
      <div id="scorebar" class="scorebar"></div>
      <div id="board" class="board"></div>

      <div id="xray" class="xray hidden"></div>

      <div class="timeline">
        <button id="tl-first" class="btn small">⏮</button>
        <button id="tl-prev" class="btn small">◀</button>
        <input id="tl-slider" type="range" min="0" max="0" value="0" />
        <button id="tl-next" class="btn small">▶</button>
        <button id="tl-last" class="btn small">⏭</button>
        <span id="tl-label" class="tl-label">move 0 / 0</span>
      </div>
    </div>

    <aside class="panel why">
      <h3>Move log</h3>
      <div id="why" class="why-body">
        <p class="muted">Every move, with its timing, appears here.</p>
      </div>
    </aside>
  </div>
</section>
